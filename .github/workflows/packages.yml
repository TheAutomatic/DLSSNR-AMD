# Builds the packages on every push and pull request, and creates a Draft GitHub Release when a v*
# tag is pushed. The version in the package names comes from the tags (*/build/version.sh). No
# package contains a model: the installers extract it from the user's own nvngx_dlssnr.dll.
#
# By default only the Windows packages (x86_64 and i686) are built; Linux users should use upstream
# GitLab Releases: https://gitlab.com/mochizuki0323/DLSSNR-AMD/-/releases
#
# Optional switches:
#   - Windows: built unless repository variable WINDOWS_PACKAGE is "off" (or tag contains "-linux-")
#   - Linux: skipped by default unless repository variable LINUX_PACKAGE is "on", workflow_dispatch
#     input build_linux is true, or tag contains "-linux-"
#   - Tag builds upload assets to a Draft Release (`gh release create --draft`)
name: Packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_linux:
        description: 'Also build Linux packages (upstream GitLab builds are linked in releases by default)'
        type: boolean
        default: false
        required: false

permissions:
  contents: write

jobs:
  linux:
    if: ${{ !contains(github.ref_name, '-win-') && (vars.LINUX_PACKAGE == 'on' || inputs.build_linux == true || contains(github.ref_name, '-linux-')) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i686]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the tags, for the version

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build mingw-w64 g++-multilib python3 p7zip-full

      - name: Cache pinned dependencies
        uses: actions/cache@v6
        with:
          path: |
            toolchain
            artifacts/ref
          key: deps-${{ hashFiles('fetch_deps.sh') }}

      - name: Fetch dependencies
        run: bash fetch_deps.sh

      - name: Build the Vulkan loader
        run: bash linux/build/build_vulkan_loader.sh

      - name: Build package
        run: NR_JOBS=$(nproc) NR_ARCH=${{ matrix.arch }} bash linux/build/build_package.sh

      - name: Check that no model was packaged
        run: |
          for f in linux/package/*.tar.gz; do
            if tar -tzf "$f" | grep -q -E '(CC_SILVER_AARDWOLD|CC_SMALL_FP8)\.bin$'; then echo "model found in $f" >&2; exit 1; fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: linux-package-${{ matrix.arch }}
          path: linux/package/*.tar.gz
          if-no-files-found: error

  windows:
    if: ${{ vars.WINDOWS_PACKAGE != 'off' && !contains(github.ref_name, '-linux-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the tags, for the version

      - name: Install build tools
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]] && grep -q 'ec2\.archive\.ubuntu\.com' /etc/apt/apt-mirrors.txt; then
            printf 'https://mirrors.edge.kernel.org/ubuntu/\nhttp://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          pkgs=(g++-mingw-w64-x86-64-win32 g++-mingw-w64-i686-posix osslsigncode)
          for pair in cmake:cmake ninja:ninja-build g++:g++ python3:python3 7z:p7zip-full openssl:openssl curl:curl git:git; do
            command -v "${pair%%:*}" >/dev/null || pkgs+=("${pair#*:}")
          done
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends "${pkgs[@]}"

      # GE-Proton's tarball is cached, its unpacked copy (1.6 GB) is not.
      - name: Cache pinned dependencies
        uses: actions/cache@v6
        with:
          path: |
            toolchain
            !toolchain/GE-Proton*
            artifacts/ref
          key: deps-windows-${{ hashFiles('fetch_deps.sh') }}

      - name: Fetch dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash fetch_deps.sh --windows

      - name: Build package   # builds the Vulkan loader and the OptiScaler DLLs too
        run: NR_JOBS=$(nproc) NR_SIGN=1 bash windows/build/build_package.sh

      - name: Check that no model was packaged
        run: |
          python3 - windows/package/*.zip <<'PY'
          import sys, zipfile
          for f in sys.argv[1:]:
              if any(n.endswith(('CC_SILVER_AARDWOLD.bin', 'CC_SMALL_FP8.bin')) for n in zipfile.ZipFile(f).namelist()):
                  sys.exit(f'model found in {f}')
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: windows/package/*.zip
          if-no-files-found: error

  release:
    needs: [linux, windows]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.linux.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=""
          if [[ "${{ needs.linux.result }}" != "success" ]]; then
            notes='> **Linux packages:** This repository builds Windows (`x86_64` / `i686`) packages by default. Linux builds are unchanged from upstream and can be downloaded from [upstream GitLab Releases](https://gitlab.com/mochizuki0323/DLSSNR-AMD/-/releases).'
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
              --draft ${notes:+--notes "$notes"} --generate-notes
          fi
