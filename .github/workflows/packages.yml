# Builds packages on v* tags or manual dispatch, and attaches them to a GitHub release for a v*
# tag. The version in the package names comes from the tags (*/build/version.sh). No
# package contains a model: the installers extract it from the user's own nvngx_dlssnr.dll.
#
# Linux packages require LINUX_PACKAGE=on. For Linux only, use a "-linux-" tag or set
# WINDOWS_PACKAGE=off; otherwise the Windows package is built too.
# A tag with "-win-" in it (v0.0.4-win-preview) is a Windows-only release: no Linux packages, and the
# release is not marked latest, so the latest release keeps its Linux packages.
name: Packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    if: ${{ vars.LINUX_PACKAGE == 'on' && !contains(github.ref_name, '-win-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tags, for the version

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build mingw-w64 g++-multilib python3 p7zip-full

      - name: Cache pinned dependencies
        uses: actions/cache@v4
        with:
          path: |
            toolchain
            artifacts/ref
          key: deps-${{ hashFiles('fetch_deps.sh') }}

      - name: Fetch dependencies
        run: bash fetch_deps.sh

      - name: Build the Vulkan loader
        run: bash linux/build/build_vulkan_loader.sh

      - name: Build packages
        run: |
          NR_ARCH=x86_64 bash linux/build/build_package.sh
          NR_ARCH=i686 bash linux/build/build_package.sh

      - name: Check that no model was packaged
        run: |
          for f in linux/package/*.tar.gz; do
            if tar -tzf "$f" | grep -q 'dlssnr\(-small\)\?\.bin$'; then echo "model found in $f" >&2; exit 1; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: linux/package/*.tar.gz
          if-no-files-found: error

  windows:
    if: ${{ vars.WINDOWS_PACKAGE != 'off' && !contains(github.ref_name, '-linux-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tags, for the version

      - name: Install build tools
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]] && grep -q 'ec2\.archive\.ubuntu\.com' /etc/apt/apt-mirrors.txt; then
            printf 'https://mirrors.edge.kernel.org/ubuntu/\nhttp://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          pkgs=(g++-mingw-w64-x86-64-win32 osslsigncode)
          for pair in cmake:cmake ninja:ninja-build g++:g++ python3:python3 7z:p7zip-full openssl:openssl curl:curl git:git; do
            command -v "${pair%%:*}" >/dev/null || pkgs+=("${pair#*:}")
          done
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends "${pkgs[@]}"

      # GE-Proton's tarball is cached, its unpacked copy (1.6 GB) is not.
      - name: Cache pinned dependencies
        uses: actions/cache@v4
        with:
          path: |
            toolchain
            !toolchain/GE-Proton11-7-x86_64
            artifacts/ref
          key: deps-windows-${{ hashFiles('fetch_deps.sh') }}

      - name: Fetch dependencies
        run: bash fetch_deps.sh --windows

      - name: Build package   # builds the Vulkan loader and the OptiScaler DLLs too
        run: NR_SIGN=1 bash windows/build/build_package.sh

      - name: Check that no model was packaged
        run: |
          python3 - windows/package/*.zip <<'PY'
          import sys, zipfile
          for f in sys.argv[1:]:
              if any(n.endswith(('CC_SILVER_AARDWOLD.bin', 'CC_SMALL_FP8.bin', 'dlssnr.bin', 'dlssnr-small.bin')) for n in zipfile.ZipFile(f).namelist()):
                  sys.exit(f'model found in {f}')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: windows/package/*.zip
          if-no-files-found: error

  release:
    needs: [linux, windows]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.linux.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=true
          case "$GITHUB_REF_NAME" in *-win-*) latest=false;; esac
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
              --generate-notes --latest="$latest"
          fi
