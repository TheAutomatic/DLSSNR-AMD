; DLSSNR-AMD D3D12 passthrough (experimental): on the OptiScaler route in D3D12 games, NR's network runs on the game's
; own D3D12 device, from a precompiled shader database registered for the game, instead of through the Vulkan bridge.
[D3D12ASD]
; 1 on (default; a game it cannot serve uses the Vulkan bridge, as with 0), 0 off. A change applies from the next launch
; (also NR Control > Diagnostics).
Enabled = 1
; 1 the game is registered at each launch, 0 never (NR Control's Unregister writes 0).
Register = 1
